# 매일 서울 25개 구 환경 값을 Supabase env_daily 표에 채운다.
# 저장소 Settings > Secrets and variables > Actions 에 DATA_GO_KR_KEY, SUPABASE_URL, SUPABASE_SERVICE_KEY 가 있어야 한다.
# (schedule은 기본 브랜치(main)에 있을 때만 돈다)
name: env-daily

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 07:00 KST (UTC 22:00)
  workflow_dispatch: {}      # Actions 탭에서 손으로도 실행

permissions:
  contents: read             # 저장소는 읽기만(이 작업은 Supabase에만 쓴다)

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: data_pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7 (태그 대신 커밋 고정, Dependabot이 갱신)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python scripts/update_env.py      # 최근 30일을 다시 받아 덮어씀 (빠진 날도 메워짐)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
