# 의존성 업데이트 PR(주 1회). 보안 업데이트 PR은 저장소 Settings → Advanced Security에서 'Dependabot security updates'를 켜야 온다.
# 큰 버전 변경(react 18→19, vite 5→8 같은 major)은 화면이 깨질 수 있어 버전 업데이트 PR로 받지 않는다.
# 대회(11/27)가 끝나면 한 브랜치에서 함께 올리고 확인한 뒤, 아래 ignore 묶음을 지운다.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/"                 # Vercel 함수가 설치하는 requirements.txt
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
